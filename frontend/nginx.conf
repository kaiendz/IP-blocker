server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend hostname per-request (via a variable) instead of
    # caching it once at startup, so the container can be recreated/restarted
    # independently without leaving nginx pointed at a stale upstream IP.
    # NGINX_LOCAL_RESOLVERS is populated at container start from /etc/resolv.conf
    # (works for both Docker's 127.0.0.11 and Podman's aardvark-dns gateway IP).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        # No URI suffix here: with a variable in proxy_pass, nginx forwards the
        # original request URI unmodified rather than stripping the location
        # prefix, so appending "/api/" here would duplicate it.
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
